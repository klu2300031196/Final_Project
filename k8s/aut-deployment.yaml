apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-aut-deployment
  labels:
    app: devops-aut
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-aut
  template:
    metadata:
      labels:
        app: devops-aut
    spec:
      containers:
      - name: aut-microservice
        image: devops-aut:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: devops-aut-service
spec:
  type: ClusterIP
  selector:
    app: devops-aut
  ports:
  - port: 5000
    targetPort: 5000
