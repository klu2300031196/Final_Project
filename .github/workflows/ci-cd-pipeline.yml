name: DevOps Continuous Testing & Quality Gate Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ---------------- STAGE 1: SAST & STATIC ANALYSIS ---------------- #
  security-audit:
    name: ðŸ›¡ï¸ Security Audit & SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Run SAST & AST Security Scanner
        run: |
          python -m tests.security.security_scanner

  # ---------------- STAGE 2: FUNCTIONAL & REGRESSION TESTS ---------------- #
  continuous-testing:
    name: ðŸ§ª Automated Testing & Coverage Gate
    needs: security-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Run PyTest Test Suites (Unit, Integration, E2E)
        run: |
          python -m coverage run --source=app -m pytest tests/unit tests/integration tests/e2e -v --junitxml=reports/junit_report.xml

      - name: Evaluate Application Code Coverage
        run: |
          python -m engine.coverage_analyzer

      - name: Archive Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-junit
          path: reports/junit_report.xml

  # ---------------- STAGE 3: PERFORMANCE BENCHMARK ---------------- #
  performance-sla:
    name: âš¡ Performance & Latency SLA Gate
    needs: continuous-testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Multi-Threaded Load Benchmark
        run: |
          python -m tests.performance.load_engine

  # ---------------- STAGE 4: QUALITY GATE & REPORTING ---------------- #
  quality-gate-enforcement:
    name: ðŸš¦ DevOps Quality Gate & Artifact Publisher
    needs: [continuous-testing, performance-sla]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Execute Full Pipeline & Quality Gate Decision
        run: |
          python -m engine.test_runner

      - name: Publish Executive HTML & JSON Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devops-continuous-testing-artifacts
          path: |
            reports/executive_dashboard.html
            reports/junit_report.xml
            reports/test_report.json

