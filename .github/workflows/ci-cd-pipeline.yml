name: DevOps Continuous Testing and Quality Gate Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuous-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  continuous-testing:
    name: Full DevOps Testing and Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create Reports Directory
        run: mkdir -p reports

      - name: Execute Complete DevOps Pipeline
        run: python -m engine.test_runner

      - name: Publish All Pipeline Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devops-continuous-testing-artifacts
          path: |
            reports/executive_dashboard.html
            reports/junit_report.xml
            reports/test_report.json
          if-no-files-found: warn
          retention-days: 14
